<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Info Panen - Harvest Intelligence</title>
  <base target="_top">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    (function() {
      if (typeof window.Chart === 'undefined' && !document.getElementById('chart-fallback')) {
        var fs = document.createElement('script');
        fs.id = 'chart-fallback';
        fs.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
        document.head.appendChild(fs);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            base: '#0B1A10',
            surface: '#111F16',
            card: '#182B1F',
            cardh: '#1F3628',
            cream: '#E8E4D9',
            sage: '#8B9A7B',
            moss: '#5A6B50',
            gold: '#D4A017',
            goldl: '#E8B830',
            emerald: '#34D399',
            amber: '#FBBF24',
            cherry: '#EF4444',
            orange: '#F97316',
          }
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0B1A10;
      color: #E8E4D9;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #111F16; }
    ::-webkit-scrollbar-thumb { background: #5A6B50; border-radius: 3px; }

    /* Shimmer skeleton */
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .skel {
      position: relative;
      overflow: hidden;
      background: #182B1F;
      border-radius: 8px;
    }
    .skel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(139,154,123,0.07) 50%, transparent 100%);
      animation: shimmer 1.6s ease-in-out infinite;
    }

    /* Screen toggle */
    .scr { display: none; opacity: 0; transition: opacity 0.35s ease; }
    .scr.on { display: flex; opacity: 1; }

    /* Login background blobs */
    @keyframes d1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,-30px) scale(1.1)} }
    @keyframes d2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-30px,40px) scale(1.15)} }
    @keyframes d3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(20px,20px) scale(0.9)} }
    .blob1 { animation: d1 12s ease-in-out infinite; }
    .blob2 { animation: d2 15s ease-in-out infinite; }
    .blob3 { animation: d3 10s ease-in-out infinite; }

    /* Card interaction */
    .pcard {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      will-change: transform;
    }
    .pcard:active { transform: scale(0.98); }
    @media (hover: hover) {
      .pcard:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      }
    }

    /* Toast animation */
    @keyframes toastIn { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes toastOut { from{transform:translateY(0);opacity:1} to{transform:translateY(100%);opacity:0} }
    .toast-in { animation: toastIn 0.3s ease forwards; }
    .toast-out { animation: toastOut 0.3s ease forwards; }

    /* Fade up on appear */
    .fup { animation: fadeUp 0.4s ease forwards; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    /* Fase border & dot colors */
    .fase-seedling { color: #34D399; border-left-color: #34D399; }
    .fase-remaja   { color: #D4A017; border-left-color: #D4A017; }
    .fase-dewasa   { color: #F97316; border-left-color: #F97316; }
    .dot-seedling  { background: #34D399; }
    .dot-remaja    { background: #D4A017; }
    .dot-dewasa    { background: #F97316; }

    /* Chart container */
    .chart-wrap { position: relative; width: 100%; max-width: 100%; max-height: 220px; overflow: hidden; }
    .chart-wrap canvas { width: 100% !important; max-width: 100% !important; max-height: 220px !important; }

    /* Pencegahan scroll horizontal & rapikan di layar kecil */
    html, body { max-width: 100%; overflow-x: hidden; }
    .scr { overflow-x: hidden; }
    #scr-app { max-width: 100vw; }
    #app-content { min-width: 0; }
    .filter-bar { flex-wrap: wrap; }

    @media (max-width: 640px) {
      .filter-bar .f-search { min-width: 100%; }
      .filter-bar .f-month { min-width: 100%; margin-top: 2px; }
      .filter-bar .f-excel { margin-left: auto; margin-top: 2px; }
      #app-content { padding-left: 12px; padding-right: 12px; }
      .chart-wrap { max-height: 200px; }
      .chart-wrap canvas { max-height: 200px !important; }
    }

    /* Minimum tap target */
    .btap { min-height: 44px; }
    @media (max-width: 640px) { .btap { min-height: 48px; } }

    /* Glass card helper */
    .glass {
      background: rgba(17,31,22,0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(139,154,123,0.1);
    }

    /* HST progress bar */
    .hst-track { background: rgba(139,154,123,0.12); border-radius: 4px; height: 4px; overflow: hidden; }
    .hst-fill  { height: 100%; border-radius: 4px; transition: width 0.6s ease; }

    /* Chip kondisi (Awal / Tervalidasi-grade / Teranalisa AI) */
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 6px;
      font-size: 10px; font-weight: 700; line-height: 1.5;
      white-space: nowrap;
    }
    .chip-green { background: rgba(52,211,153,0.12); color: #34D399; border: 1px solid rgba(52,211,153,0.2); }
    .chip-gold  { background: rgba(212,160,23,0.12); color: #D4A017; border: 1px solid rgba(212,160,23,0.2); }
    .chip-muted { background: rgba(139,154,123,0.1); color: #8B9A7B; border: 1px solid rgba(139,154,123,0.18); }
  </style>
</head>

<body class="min-h-screen bg-base">

  <!-- ============================================
       1. LOGIN SCREEN
       ============================================ -->
  <div id="scr-login" class="scr on flex-col items-center justify-center min-h-screen relative overflow-hidden px-4">

    <!-- Animated background blobs -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
      <div class="blob1 absolute -top-32 -left-32 w-80 h-80 rounded-full blur-3xl" style="background:rgba(212,160,23,0.05)"></div>
      <div class="blob2 absolute top-1/3 -right-20 w-96 h-96 rounded-full blur-3xl" style="background:rgba(52,211,153,0.05)"></div>
      <div class="blob3 absolute -bottom-20 left-1/4 w-72 h-72 rounded-full blur-3xl" style="background:rgba(212,160,23,0.04)"></div>
    </div>

    <div class="relative z-10 w-full max-w-sm">

      <!-- Logo & title -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4" style="background:rgba(212,160,23,0.1);border:1px solid rgba(212,160,23,0.2)">
          <svg class="w-8 h-8 text-gold" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M12 3c-1.5 3-4 5.5-4 9a4 4 0 008 0c0-3.5-2.5-6-4-9z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-cream tracking-tight">Info Panen</h1>
        <p class="text-sage text-sm mt-1">Harvest Intelligence Portal</p>
      </div>

      <!-- Login form card -->
      <div class="glass rounded-2xl p-6" style="box-shadow:0 0 24px rgba(212,160,23,0.1)">
        <div class="space-y-4">
          <div>
            <label for="inp-user" class="block text-xs font-semibold text-sage mb-1.5 uppercase tracking-wider">Username</label>
            <input id="inp-user" type="text" autocomplete="username" placeholder="Masukkan username"
              class="btap w-full bg-card rounded-xl px-4 py-3 text-cream placeholder-moss focus:outline-none focus:ring-1 focus:ring-gold/30 transition text-sm"
              style="border:1px solid rgba(139,154,123,0.15)">
          </div>
          <div>
            <label for="inp-pass" class="block text-xs font-semibold text-sage mb-1.5 uppercase tracking-wider">Password</label>
            <input id="inp-pass" type="password" autocomplete="current-password" placeholder="Masukkan password"
              class="btap w-full bg-card rounded-xl px-4 py-3 text-cream placeholder-moss focus:outline-none focus:ring-1 focus:ring-gold/30 transition text-sm"
              style="border:1px solid rgba(139,154,123,0.15)">
          </div>
          <button id="btn-login" onclick="doLogin()"
            class="btap w-full bg-gold hover:bg-goldl active:scale-[0.98] text-base font-bold rounded-xl py-3.5 transition-all text-sm tracking-wide">
            Masuk
          </button>
        </div>
        <p id="login-err" class="text-cherry text-xs mt-3 text-center hidden"></p>
      </div>

      <p class="text-moss text-[11px] text-center mt-6 leading-relaxed">
        Portal informasi panen dari SIMSTOK<br>Data read-only untuk Marketing &amp; Budidaya
      </p>
    </div>
  </div>


  <!-- ============================================
       2. MAIN APP SHELL
       ============================================ -->
  <div id="scr-app" class="scr flex-col min-h-screen">

    <!-- Top navigation bar -->
    <header class="sticky top-0 z-40 border-b" style="background:rgba(17,31,22,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:rgba(139,154,123,0.1)">
      <div class="max-w-3xl mx-auto flex items-center justify-between px-4 h-14">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:rgba(212,160,23,0.1);border:1px solid rgba(212,160,23,0.2)">
            <svg class="w-4 h-4 text-gold" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 3c-1.5 3-4 5.5-4 9a4 4 0 008 0c0-3.5-2.5-6-4-9z"/>
            </svg>
          </div>
          <div>
            <span class="text-cream font-bold text-sm">Info Panen</span>
            <span id="nav-role" class="ml-2 inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider" style="background:rgba(212,160,23,0.15);color:#D4A017;border:1px solid rgba(212,160,23,0.2)"></span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span id="nav-name" class="text-sage text-xs hidden sm:inline"></span>
          <button onclick="doLogout()" class="btap flex items-center justify-center w-9 h-9 rounded-lg bg-card hover:bg-cardh transition" style="border:1px solid rgba(139,154,123,0.1)" title="Keluar">
            <svg class="w-4 h-4 text-sage" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Dynamic content area -->
    <main id="app-content" class="flex-1 max-w-3xl mx-auto w-full px-4 py-6 pb-24"></main>
  </div>


  <!-- ============================================
       3. TOAST CONTAINER
       ============================================ -->
  <div id="toast-box" class="fixed bottom-6 left-4 right-4 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>


  <!-- ============================================
       JAVASCRIPT
       ============================================ -->
  <script>
    /* ─── STATE ──────────────────────────── */
    var S = {
      user: null,
      role: null,
      token: null,
      data: null,
      meta: null,
      charts: {},
      loaded: false,
      search: '',
      month: '',
      aiRows: []
    };

    /* ─── GAS RPC WRAPPER ───────────────── */
    function rpc(fn) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        if (typeof google === 'undefined' || !google.script) {
          reject(new Error('GAS runtime tidak tersedia.'));
          return;
        }
        var serverFn = google.script.run[fn];
        if (typeof serverFn !== 'function') {
          reject(new Error('Fungsi "' + fn + '" tidak tersedia di server. Pastikan backend sudah redeploy versi terbaru.'));
          return;
        }
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function(err) {
            console.error('RPC ' + fn + ' failed:', err);
            reject(err);
          })
          [fn].apply(null, args);
      });
    }

    /* ─── SCREEN NAV ────────────────────── */
    function showScreen(id) {
      var els = document.querySelectorAll('.scr');
      for (var i = 0; i < els.length; i++) els[i].classList.remove('on');
      var el = document.getElementById(id);
      if (el) el.classList.add('on');
    }

    /* ─── TOAST ─────────────────────────── */
    function toast(msg, type, dur) {
      type = type || 'info';
      dur = dur || 3500;
      var box = document.getElementById('toast-box');
      var bgMap = {
        info:    'background:rgba(24,43,31,0.95);border:1px solid rgba(139,154,123,0.2);color:#E8E4D9',
        success: 'background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.25);color:#34D399',
        error:   'background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);color:#EF4444',
        warn:    'background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.25);color:#FBBF24'
      };
      var icMap = { info: '&#x2139;', success: '&#x2713;', error: '&#x2715;', warn: '&#x26A0;' };
      var t = document.createElement('div');
      t.className = 'pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl text-sm font-medium toast-in';
      t.style.cssText = bgMap[type] || bgMap.info;
      t.innerHTML = '<span class="text-base">' + (icMap[type] || icMap.info) + '</span><span>' + esc(msg) + '</span>';
      box.appendChild(t);
      setTimeout(function() {
        t.classList.replace('toast-in', 'toast-out');
        setTimeout(function() { t.remove(); }, 300);
      }, dur);
    }

    /* ─── LOGIN ─────────────────────────── */
    var LS_KEY = 'infopanen.auth';
    function saveSession() {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({ token: S.token, role: S.role, name: S.name, expiry: Date.now() + (4 * 60 * 60 * 1000) }));
      } catch (e) {}
    }
    function loadSession() {
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (!raw) return null;
        var d = JSON.parse(raw);
        if (!d || !d.token || !d.role) return null;
        if (d.expiry && Date.now() > d.expiry) { clearSession(); return null; }
        return d;
      } catch (e) { return null; }
    }
    function clearSession() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }

    function attemptAutoLogin() {
      var d = loadSession();
      if (!d) return;
      S.user = { role: d.role, name: d.name, token: d.token };
      S.role = d.role;
      S.token = d.token;
      S.search = '';
      S.month = '';
      document.getElementById('nav-role').textContent = d.role;
      document.getElementById('nav-name').textContent = d.name;
      showScreen('scr-app');
      loadDashboard();
    }

    function doLogin() {
      var u = document.getElementById('inp-user').value.trim();
      var p = document.getElementById('inp-pass').value;
      var errEl = document.getElementById('login-err');
      var btn = document.getElementById('btn-login');

      if (!u || !p) {
        errEl.textContent = 'Username dan password wajib diisi.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';
      errEl.classList.add('hidden');

      rpc('authenticateUser', u, p).then(function(res) {
        if (res.success) {
          S.user = res;
          S.role = res.role;
          S.token = res.token;
          saveSession();
          document.getElementById('nav-role').textContent = res.role;
          document.getElementById('nav-name').textContent = res.name;
          showScreen('scr-app');
          loadDashboard();
        } else {
          errEl.textContent = res.message;
          errEl.classList.remove('hidden');
        }
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }).catch(function() {
        errEl.textContent = 'Koneksi gagal. Coba lagi.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Masuk';
      });
    }

    /* ─── LOGOUT ────────────────────────── */
    function doLogout() {
      S.user = null;
      S.role = null;
      S.token = null;
      S.data = null;
      S.meta = null;
      S.loaded = false;
      S.search = '';
      S.month = '';
      S.aiRows = [];
      destroyCharts();
      closeAiModal();
      clearSession();
      document.getElementById('inp-user').value = '';
      document.getElementById('inp-pass').value = '';
      showScreen('scr-login');
    }

    /* ─── RE-RENDER AKTIF (search & filter bulan) ── */
    function applyViewSearch() {
      if (S.role === 'marketing') renderMarketingView();
      else renderBudidayaView();
      var inp = document.getElementById('inp-search');
      if (inp) {
        var len = inp.value.length;
        inp.focus();
        try { inp.setSelectionRange(len, len); } catch(e) {}
      }
    }

    /* ─── FILTER BAR (search + pilih bulan) ── */
    function buildMonthOptions() {
      var groups = S.data || [];
      var opts = '<option value="">Semua Bulan</option>';
      for (var i = 0; i < groups.length; i++) {
        var g = groups[i];
        opts += '<option value="' + attrEsc(g.monthKey) + '"' + (S.month === g.monthKey ? ' selected' : '') + '>' + attrEsc(g.label) + '</option>';
      }
      return opts;
    }

    function renderFilterBar(role) {
      var months = '';
      if (role === 'budidaya') {
        months = '<select id="inp-month" onchange="S.month=this.value;applyViewSearch();" class="btap bg-card text-cream text-xs px-2.5 rounded-lg focus:outline-none" style="border:1px solid rgba(139,154,123,0.15);min-height:44px;">'
          + buildMonthOptions() + '</select>';
      }
      var excel = '<button onclick="exportFilteredExcel()" title="Download Excel (data filter aktif)" class="btap inline-flex items-center gap-1.5 px-3 rounded-lg text-xs font-bold bg-card hover:bg-cardh transition" style="border:1px solid rgba(212,160,23,0.25);color:#D4A017;min-height:44px;">'
        + '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>'
        + 'Excel</button>';
      return '<div class="filter-bar flex items-center gap-2 mb-5 fup">'
        + '<div class="relative flex-1 f-search">'
        +   '<input id="inp-search" type="search" value="' + attrEsc(S.search) + '" oninput="S.search=this.value;applyViewSearch();" placeholder="Cari kode / produk / petani / keunikan..." autocomplete="off" class="w-full bg-card rounded-xl pl-4 pr-9 py-2.5 text-sm text-cream placeholder-moss focus:outline-none transition" style="border:1px solid rgba(139,154,123,0.15);min-height:44px;">'
        +   '<svg class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-moss" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>'
        + '</div>'
        + (months ? '<span class="f-month">' + months + '</span>' : '')
        + '<span class="f-excel">' + excel + '</span>'
        + '</div>';
    }

    /* ─── EXPORT EXCEL (data filter aktif) ── */
    function exportFilteredExcel() {
      if (!S.data) return;
      var q = (S.search || '').trim().toLowerCase();
      var headers, rows = [], fname;

      if (S.role === 'marketing') {
        headers = ['Kode', 'Kode Asal', 'Produk', 'Keunikan', 'Fase', 'Petani', 'Stok Jual', 'Normal Dijual', 'Afkir Dijual', 'Est. Panen', 'Harga Seedling', 'Status'];
        var list = S.data || [];
        for (var i = 0; i < list.length; i++) {
          var it = list[i];
          if (q) {
            var hay = ((it.kodeProject || '') + ' ' + (it.namaProduk || '') + ' ' + (it.kodeAsal || '') + ' ' + (it.namaPetani || '') + ' ' + (it.keunikan || '')).toLowerCase();
            if (hay.indexOf(q) < 0) continue;
          }
          rows.push([
            it.kodeProject, it.kodeAsal || '', it.namaProduk || '', it.keunikan || '',
            it.fase || '', it.namaPetani || '', effStock(it), aiDijual(it), it.qtyAfkir || 0,
            it.estPanenStr || '', it.hargaSeedling || 0, it.statusValidasi || ''
          ]);
        }
        fname = 'InfoPanen-Marketing-' + new Date().toISOString().slice(0, 10) + '.xlsx';
      } else {
        headers = ['Bulan', 'Kode', 'Kode Asal', 'Produk', 'Keunikan', 'Fase', 'Petani', 'Stok Jual', 'Normal Dijual', 'Afkir Dijual', 'HST', 'Status'];
        var groups = S.data || [];
        for (var g = 0; g < groups.length; g++) {
          var grp = groups[g];
          if (S.month && grp.monthKey !== S.month) continue;
          for (var j = 0; j < grp.items.length; j++) {
            var it2 = grp.items[j];
            if (q) {
              var hay2 = ((it2.kodeProject || '') + ' ' + (it2.namaProduk || '') + ' ' + (it2.kodeAsal || '') + ' ' + (it2.namaPetani || '') + ' ' + (it2.keunikan || '')).toLowerCase();
              if (hay2.indexOf(q) < 0) continue;
            }
            rows.push([
              grp.label, it2.kodeProject, it2.kodeAsal || '', it2.namaProduk || '', it2.keunikan || '',
              it2.fase || '', it2.namaPetani || '', effStock(it2), aiDijual(it2), it2.qtyAfkir || 0, it2.hst || 0, it2.statusValidasi || ''
            ]);
          }
        }
        fname = 'InfoPanen-Budidaya-' + new Date().toISOString().slice(0, 10) + '.xlsx';
      }

      if (rows.length === 0) { toast('Tidak ada data untuk diekspor (filter kosong).', 'warn'); return; }

      if (typeof XLSX !== 'undefined') {
        var aoa = [headers].concat(rows);
        var ws = XLSX.utils.aoa_to_sheet(aoa);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, S.role === 'marketing' ? 'Marketing' : 'Budidaya');
        XLSX.writeFile(wb, fname);
        toast(rows.length + ' baris diekspor ke .xlsx', 'success');
      } else {
        var csv = '\ufeff' + headers.join(';') + '\n';
        for (var r = 0; r < rows.length; r++) {
          csv += rows[r].map(csvCell_).join(';') + '\n';
        }
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = fname.replace('.xlsx', '.csv');
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        toast(rows.length + ' baris diekspor (fallback .csv)', 'success');
      }
    }

    function csvCell_(v) {
      var s = String(v === null || v === undefined ? '' : v);
      if (/[;"\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    }

    /* ─── CHIP KONDISI: 1) Awal 2) Tervalidasi (grade) 3) Teranalisa AI (jual/besar) ── */
    function aiInfoFor(kp, fase, kodeAsal) {
      if (!S.aiRows || !S.aiRows.length) return null;
      var t = String(kp || '').trim();
      var tF = String(fase || '').trim();
      var best = null, foundFase = false;
      for (var i = S.aiRows.length - 1; i >= 1; i--) {
        var r = S.aiRows[i];
        var c1 = String(r[1] || '').trim();
        var c9 = String(r[9] || '').trim();
        if (c1 !== t && !(c9 && c9 === t)) continue;
        if (!best || foundFase) best = r;
        if (tF && String(r[3] || '').trim() === tF) { best = r; foundFase = true; break; }
      }
      if (!best) return null;
      return { dijual: Number(best[7]) || 0, dibesarkan: Number(best[6]) || 0, qtyNormal: Number(best[5]) || 0, bulan: best[0], kecocokanFase: foundFase };
    }

    function aiDijual(it) {
      var ai = aiInfoFor(it.kodeProject, it.fase, it.kodeAsal);
      return ai ? (ai.dijual || 0) : 0;
    }

    function analysisChips(it) {
      var html = '';
      if (it.statusValidasi === 'Tervalidasi') {
        html += '<span class="chip chip-green">&#10003; Validasi &bull; N ' + fmtNum(it.qtyNormal) + ' / A ' + fmtNum(it.qtyAfkir) + '</span>';
      } else {
        html += '<span class="chip chip-muted">Data Awal</span>';
      }
      var ai = aiInfoFor(it.kodeProject, it.fase, it.kodeAsal);
      if (ai) {
        html += '<span class="chip chip-gold">&#129504; AI &bull; Jual ' + fmtNum(ai.dijual) + ' / Besar ' + fmtNum(ai.dibesarkan) + '</span>';
      }
      return html;
    }

    /* Stok efektif utk GH Jual: tervalidasi + sudah analisa AI → qty afkir + qty jual.
       Selain itu pakai sisa stok asli. */
    function effStock(it) {
      if (it.statusValidasi === 'Tervalidasi') {
        var ai = aiInfoFor(it.kodeProject, it.fase, it.kodeAsal);
        if (ai) return (it.qtyAfkir || 0) + (ai.dijual || 0);
      }
      return it.sisaStok || 0;
    }

            S.loaded = true;

              if (S.role === 'marketing') renderMarketingView();

              content.innerHTML = renderErrorState('Kesalahan render: ' + (renderErr && renderErr.message || renderErr));
            }
            rpc('fetchAiRows', S.token).then(function(rows) {
              S.aiRows = Array.isArray(rows) ? rows : [];
              applyViewSearch();
            }).catch(function() { S.aiRows = []; });
          } else if (res && res.message && res.message.indexOf('Sesi') >= 0) {

              content.innerHTML = renderDiagState(
                'Respons server kosong. Detail konfigurasi server:',

              );
            }).catch(function() {

            });

    }

    /* AI Insights — tampilkan hasil dari sheet Analisa AI SIMSTOK */
    function requestAi(btn) {
      var kp = btn.getAttribute('data-kp') || '';
      var fase = btn.getAttribute('data-fase') || '';
      var idP = btn.getAttribute('data-idp') || '';
      var orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<svg class="w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Loading...';
      rpc('getAiInsights', kp, fase, idP, S.token).then(function(res) {
        btn.disabled = false;
        btn.innerHTML = orig;
        if (res && res.status === 'ok') { showAiInsight(res); return; }
        if (res && res.status === 'auth_failed') { doLogout(); toast(res.message, 'error', 4000); return; }
        /* Fallback: baca langsung semua baris Analisa AI */
        rpc('fetchAiRows', S.token).then(function(rows) {
          if (!Array.isArray(rows)) {
            showAiInsight({ status: 'empty', message: 'Server tidak mengembalikan data AI untuk ' + kp + '. ' + (rows && rows[1] ? rows[1] : 'Pastikan backend sudah redeploy.') });
            return;
          }
          var t = String(kp).trim(), tFase = String(fase).trim(), found = null, foundFase = false;
          for (var i = rows.length - 1; i >= 1; i--) {
            var r = rows[i];
            var c1 = String(r[1] || '').trim(), c9 = String(r[9] || '').trim();
            if (c1 !== t && !(c9 && c9 === t)) continue;
            if (!found || foundFase) found = r;
            if (tFase && String(r[3] || '').trim() === tFase) { found = r; foundFase = true; break; }
          }
          if (!found) {
            showAiInsight({ status: 'empty', message: 'Belum ada rekomendasi AI untuk kode ' + t + (tFase ? ' (fase ' + tFase + ')' : '') + ' di sheet Analisa AI.' });
            return;
          }
          var dijual = Number(found[7]) || 0, harga = Number(found[13]) || 0;
          showAiInsight({
            status: 'ok',
            bulan: String(found[0] || ''),
            kodeProject: found[1],
            namaProduk: found[2],
            fase: found[3],
            namaPetani: found[4],
            keunikan: found[10],
            qtyNormal: Number(found[5]) || 0,
            dibesarkan: Number(found[6]) || 0,
            dijual: dijual,
            omzet: Math.round(dijual * harga),
            alasan: found[8]
          });
        }).catch(function(err2) {
          showAiInsight({ status: 'empty', message: 'Gagal membaca data AI: ' + (err2 && err2.message || err2) });
        });
      }).catch(function(err) {
        toast('Gagal menghubungi AI service: ' + (err && err.message || err), 'error');
        btn.disabled = false;
        btn.innerHTML = orig;
      });
    }

    function renderBudidayaView() {
      var content = document.getElementById('app-content');

      var meta = S.meta || {};
      var q = (S.search || '').trim().toLowerCase();

      var data = [];
      for (var g0 = 0; g0 < allSrc.length; g0++) {
        var src = allSrc[g0];
        if (S.month && src.monthKey !== S.month) continue;
        var mitems = [];
        for (var i0 = 0; i0 < src.items.length; i0++) {
          var it0 = src.items[i0];
          if (q) {
            var hay = ((it0.kodeProject || '') + ' ' + (it0.namaProduk || '') + ' ' + (it0.kodeAsal || '') + ' ' + (it0.namaPetani || '') + ' ' + (it0.keunikan || '')).toLowerCase();
            if (hay.indexOf(q) < 0) continue;
          }
          mitems.push(it0);
        }
        if (!mitems.length) continue;
        var faseSum = { Seedling: 0, Remaja: 0, Dewasa: 0 }, totalSisaM = 0;
        for (var k0 = 0; k0 < mitems.length; k0++) {
          var es = effStock(mitems[k0]);
          if (faseSum.hasOwnProperty(mitems[k0].fase)) faseSum[mitems[k0].fase] += es;
          totalSisaM += es;
        }
        data.push({ monthKey: src.monthKey, label: src.label, month: src.month, year: src.year, items: mitems, faseSummary: faseSum, totalSisaStok: totalSisaM });
      }

      content.innerHTML = renderFilterBar('budidaya');
      if (data.length === 0) {
        content.innerHTML += renderEmptyState(
          (S.data || []).length ? 'Tidak ada hasil untuk filter yang dipilih.' : 'Belum ada proyeksi panen dalam 5 bulan ke depan.',
          'Budidaya'
        );
        return;
      }

      var groups = '';
      for (var gIdx = 0; gIdx < data.length; gIdx++) {
        var grp = data[gIdx];
        var delay = Math.min(gIdx * 100, 600);
        var chartId = 'chart-' + grp.monthKey;

        /* Items within this month group */
        var items = '';
        for (var iIdx = 0; iIdx < grp.items.length; iIdx++) {
          var it = grp.items[iIdx];
          var isValid = it.statusValidasi === 'Tervalidasi';
          var itemDelay = Math.min(iIdx * 40, 400);

          var dotCls = it.fase === 'Seedling' ? 'dot-seedling' : it.fase === 'Remaja' ? 'dot-remaja' : 'dot-dewasa';

          /* Status badge */
          var badge = '';
          if (isValid) {
            badge = '<span class="shrink-0 inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider" style="background:rgba(52,211,153,0.15);color:#34D399;border:1px solid rgba(52,211,153,0.2)">Tervalidasi</span>';
          } else {
            badge = '<span class="shrink-0 inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider" style="background:rgba(251,191,36,0.15);color:#FBBF24;border:1px solid rgba(251,191,36,0.2)">' + esc(it.statusValidasi) + '</span>';
          }

          /* HST mini bar (dihapus utk hemat ruang) */

          items += '<div class="flex items-center gap-3 rounded-lg px-3 py-2.5 fup" style="background:rgba(17,31,22,0.6);border:1px solid rgba(139,154,123,0.05);animation-delay:' + itemDelay + 'ms">'
            + '<span class="w-2.5 h-2.5 rounded-full shrink-0 ' + dotCls + '"></span>'
            + '<div class="flex-1 min-w-0">'
            +   '<p class="text-cream text-sm font-semibold break-words">' + esc(it.kodeProject) + ' <span class="text-sage font-normal">&mdash; ' + esc(it.namaProduk || '-') + '</span></p>'
            +   '<div class="flex items-center gap-2 mt-0.5">'
            +     '<span class="text-moss text-[11px] truncate">' + esc(it.namaPetani) + '</span>'
            +     '<span class="text-moss text-[10px]">&bull;</span>'
            +     '<span class="text-moss text-[11px]">HST ' + it.hst + '</span>'
            +   '</div>'
            + '<div class="flex flex-wrap items-center gap-1.5 mt-1.5">' + analysisChips(it) + '</div>'
            + '</div>'
            + '<div class="text-right shrink-0 mr-2">'
            +   '<p class="text-cream text-sm font-bold">' + fmtNum(effStock(it)) + '</p>'
            +   '<p class="text-moss text-[10px]">' + esc(it.fase) + '</p>'
            + '</div>'
            + badge
          + '</div>';
        }

        groups += '<section class="mb-8 fup" style="animation-delay:' + delay + 'ms">'
          + '<div class="flex items-center gap-2 mb-3">'
          +   '<h3 class="text-cream font-bold text-base">' + esc(grp.label) + '</h3>'
          +   '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold" style="background:rgba(212,160,23,0.1);color:#D4A017;border:1px solid rgba(212,160,23,0.15)">' + grp.items.length + ' item</span>'
          +   '<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-surface text-sage">' + fmtNum(grp.totalSisaStok) + ' stok</span>'
          + '</div>'
          + '<div class="chart-wrap bg-card rounded-xl p-3 mb-3" style="border:1px solid rgba(139,154,123,0.08)">'
          +   '<canvas id="' + chartId + '"></canvas>'
          + '</div>'
          + '<div class="grid gap-2">' + items + '</div>'
        + '</section>';
      }

      /* Summary stats */
      var flatCount = 0, grandSisa = 0;
      for (var gg = 0; gg < data.length; gg++) { flatCount += data[gg].items.length; grandSisa += data[gg].totalSisaStok; }

      var html = ''
        + '<div class="mb-6 fup">'
        +   '<h2 class="text-cream font-extrabold text-xl tracking-tight">Proyeksi Panen</h2>'
        +   '<p class="text-sage text-sm mt-1"><span class="text-gold font-semibold">' + esc(meta.periodStart) + '</span> &mdash; <span class="text-gold font-semibold">' + esc(meta.periodEnd) + '</span></p>'
        + '</div>'
        + '<div class="grid grid-cols-3 gap-3 mb-6 fup" style="animation-delay:80ms">'
        +   '<div class="bg-card rounded-xl p-3 text-center" style="border:1px solid rgba(139,154,123,0.08)">'
        +     '<p class="text-2xl font-extrabold text-cream">' + flatCount + '</p>'
        +     '<p class="text-[10px] text-sage uppercase tracking-wider font-semibold mt-0.5">Total Item</p>'
        +   '</div>'
        +   '<div class="bg-card rounded-xl p-3 text-center" style="border:1px solid rgba(139,154,123,0.08)">'
        +     '<p class="text-2xl font-extrabold text-gold">' + fmtNum(grandSisa) + '</p>'
        +     '<p class="text-[10px] text-sage uppercase tracking-wider font-semibold mt-0.5">Stok Jual</p>'
        +   '</div>'
        +   '<div class="bg-card rounded-xl p-3 text-center" style="border:1px solid rgba(139,154,123,0.08)">'
        +     '<p class="text-2xl font-extrabold text-emerald">' + data.length + '</p>'
        +     '<p class="text-[10px] text-sage uppercase tracking-wider font-semibold mt-0.5">Bulan Aktif</p>'
        +   '</div>'
        + '</div>'
        + '<p class="text-moss text-[11px] mb-5 fup" style="animation-delay:140ms"><span class="text-gold font-semibold">Stok Jual</span> = Qty Normal (dialokasikan jual) + Qty Afkir. Berlaku untuk kode yang sudah tervalidasi &amp; teranalisa AI.</p>'
        + groups;

      content.innerHTML = renderFilterBar('budidaya') + html;

      /* Render Chart.js instances after DOM update */
      if (typeof Chart === 'undefined') {
        console.warn('Chart.js tidak termuat — grafik dilewati.');
        for (var gc = 0; gc < data.length; gc++) {
          var cv2 = document.getElementById('chart-' + data[gc].monthKey);
          if (cv2) {
            var p2 = cv2.parentNode;
            p2.innerHTML = '<p class="text-moss text-[11px] text-center py-2">Grafik tidak tersedia (Chart.js gagal dimuat).</p>';
          }
        }
      } else {
        requestAnimationFrame(function() {
          for (var g2 = 0; g2 < data.length; g2++) {
            createFaseChart('chart-' + data[g2].monthKey, data[g2].faseSummary, data[g2].label);
          }
        });
      }

      toast(flatCount + ' item termuat', 'success');
    }

    /* ─── Chart.js: Fase bar chart (horizontal, label qty di kanan) ── */
    function createFaseChart(canvasId, faseSummary, label) {
      var canvas = document.getElementById(canvasId);
      if (!canvas) return;
      var ctx = canvas.getContext('2d');

      var fases  = ['Seedling', 'Remaja', 'Dewasa'];
      var values = [faseSummary.Seedling || 0, faseSummary.Remaja || 0, faseSummary.Dewasa || 0];
      var borders = ['#34D399', '#D4A017', '#F97316'];
      var bgs     = ['rgba(52,211,153,0.2)', 'rgba(212,160,23,0.2)', 'rgba(249,115,22,0.2)'];

      var valueLabelPlugin = {
        id: 'valueLabels',
        afterDatasetsDraw: function(chart) {
          var meta0 = chart.getDatasetMeta(0);
          if (!meta0 || !meta0.data || !meta0.data.length) return;
          var c = chart.ctx;
          c.save();
          c.font = "700 12px 'Plus Jakarta Sans', sans-serif";
          c.textBaseline = 'middle';
          c.textAlign = 'left';
          var ds = chart.data.datasets[0].data;
          for (var i = 0; i < meta0.data.length; i++) {
            var el = meta0.data[i];
            if (!el || typeof el.x !== 'number') continue;
            var v = ds[i];
            if (!v) continue;
            c.fillStyle = '#E8E4D9';
            var maxX = chart.chartArea ? chart.chartArea.right - 6 : el.x;
            c.fillText(fmtNum(v), Math.min(el.x + 8, maxX), el.y);
          }
          c.restore();
        }
      };

      if (S.charts[canvasId]) { try { S.charts[canvasId].destroy(); } catch(e) {} }

      S.charts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: fases,
          datasets: [{
            label: 'Sisa Stok',
            data: values,
            backgroundColor: bgs,
            borderColor: borders,
            borderWidth: 2,
            borderRadius: 6,
            borderSkipped: false,
            maxBarThickness: 30
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#182B1F',
              titleColor: '#E8E4D9',
              bodyColor: '#E8E4D9',
              borderColor: 'rgba(139,154,123,0.2)',
              borderWidth: 1,
              cornerRadius: 8,
              padding: 10,
              titleFont: { family: 'Plus Jakarta Sans', weight: '700', size: 12 },
              bodyFont: { family: 'Plus Jakarta Sans', size: 12 },
              callbacks: {
                label: function(ctx2) { return ' ' + fmtNum(ctx2.raw) + ' unit'; }
              }
            }
          },
          scales: {
            x: {
              beginAtZero: true,
              grace: '12%',
              grid: { color: 'rgba(139,154,123,0.08)' },
              ticks: { color: '#5A6B50', font: { family: 'Plus Jakarta Sans', size: 10 }, callback: function(v) { return fmtNum(v); } },
              border: { display: false }
            },
            y: {
              grid: { display: false },
              ticks: { color: '#8B9A7B', font: { family: 'Plus Jakarta Sans', size: 11, weight: '600' } },
              border: { display: false }
            }
          },
          layout: { padding: { right: 36 } },
          animation: { duration: 600, easing: 'easeOutQuart' }
        },
        plugins: [valueLabelPlugin]
      });
    }


    /* ============================================
       SHARED COMPONENTS
       ============================================ */

    function renderEmptyState(msg, role) {
      return '<div class="flex flex-col items-center justify-center py-20 text-center fup">'
        + '<svg class="w-20 h-20 mb-4" style="color:rgba(90,107,80,0.35)" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">'
        +   '<path d="M9 12h6M12 9v6M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9v-2.25A2.25 2.25 0 019.75 3h4.5A2.25 2.25 0 0116.5 5.25V7.5"/>'
        + '</svg>'
        + '<h3 class="text-cream font-bold text-lg mb-1">Data Kosong</h3>'
        + '<p class="text-sage text-sm max-w-xs">' + esc(msg) + '</p>'
        + '<p class="text-moss text-xs mt-4">Role: ' + esc(role) + ' &bull; Periksa kembali nanti</p>'
      + '</div>';
    }

    function renderErrorState(msg) {
      return '<div class="flex flex-col items-center justify-center py-20 text-center fup">'
        + '<svg class="w-16 h-16 mb-4" style="color:rgba(239,68,68,0.5)" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">'
        +   '<path d="M12 9v3.75m-9.308 5.25a17.925 17.925 0 0113.616 0c.729.263 1.453.548 2.168.855l.532.261a1.5 1.5 0 01-.532 2.788H3.924a1.5 1.5 0 01-.532-2.788l.532-.261a17.85 17.85 0 012.168-.855A17.925 17.925 0 0112 16.5c2.387 0 4.645.553 6.692 1.5M12 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>'
        + '</svg>'
        + '<h3 class="text-cream font-bold text-lg mb-1">Terjadi Kesalahan</h3>'
        + '<p class="text-sage text-sm max-w-xs">' + esc(msg) + '</p>'
        + '<button onclick="S.loaded=false;loadDashboard();" class="btap mt-4 px-5 py-2.5 rounded-xl text-sm font-semibold transition active:scale-95" style="background:rgba(212,160,23,0.1);border:1px solid rgba(212,160,23,0.2);color:#D4A017">Coba Lagi</button>'
      + '</div>';
    }

    function renderDiagState(msg, diagText) {
      return '<div class="fup">'
        + '<h2 class="text-cream font-extrabold text-lg mb-2">Kesalahan Sistem</h2>'
        + '<p class="text-sage text-sm mb-3">' + esc(msg) + '</p>'
        + (diagText ? '<pre style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:12px;padding:12px 14px;color:#E8E4D9;font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-word;overflow-x:auto;text-align:left;max-height:320px;overflow-y:auto;">' + esc(diagText) + '</pre>' : '')
        + '<button onclick="S.loaded=false;loadDashboard();" class="btap mt-4 px-5 py-2.5 rounded-xl text-sm font-semibold transition active:scale-95" style="background:rgba(212,160,23,0.1);border:1px solid rgba(212,160,23,0.2);color:#D4A017">Coba Lagi</button>'
      + '</div>';
    }


    /* ============================================
       UTILITIES
       ============================================ */

    /* Escape HTML — mencegah XSS */
    function esc(str) {
      if (!str) return '';
      var d = document.createElement('div');
      d.textContent = String(str);
      return d.innerHTML;
    }

    /* Escape untuk konteks atribut HTML (data-* / onclick) — handle kutip ganda & tunggal */
    function attrEsc(str) {
      return esc(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    /* Format angka dengan pemisah ribuan */
    function fmtNum(n) {
      if (n == null || isNaN(n)) return '0';
      return Number(n).toLocaleString('id-ID');
    }


    /* ============================================
       KEYBOARD SUPPORT
       ============================================ */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var loginScr = document.getElementById('scr-login');
        if (loginScr && loginScr.classList.contains('on')) {
          doLogin();
        }
      }
    });

    /* Auto-focus username field on load */
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        attemptAutoLogin();
        var inp = document.getElementById('inp-user');
        if (inp && document.getElementById('scr-login').classList.contains('on')) inp.focus();
      }, 300);
    });
  </script>

</body>
</html>
