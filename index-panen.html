    <style>
        *{box-sizing:border-box}

        .login-bg{position:relative;overflow:hidden}
        .blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.12;animation:bf 20s ease-in-out infinite}

        .b2{width:350px;height:350px;background:#059669;bottom:-100px;left:-50px;animation-delay:-10s}

        .login-card{background:rgba(20,24,32,.85);backdrop-filter:blur(24px);border:1px solid rgba(42,47,62,.6)}

        .inp{background:#1C2030;border:1px solid #2A2F3E;transition:border-color .2s,box-shadow .2s;color:#fff}
        .inp:focus{border-color:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.15);outline:none}

        .btn-p{background:#10B981;color:#fff;transition:background .2s,transform .1s,box-shadow .2s}

        .btn-p:active{transform:scale(.98)}
        .btn-p:disabled{opacity:.5;cursor:not-allowed}

        .dt{border-collapse:separate;border-spacing:0;width:100%}
        .dt thead th{position:sticky;top:0;z-index:10;background:#1C2030;border-bottom:1px solid #2A2F3E;padding:12px 16px;text-align:left;font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#8B90A0;cursor:pointer;user-select:none;transition:color .2s}
        .dt thead th:hover{color:#E4E6EB}
        .dt thead th.srt{color:#10B981}

        @keyframes tO{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(80px)}}

    <header class="bg-base-800/80 backdrop-blur-md border-b border-base-600 sticky top-0 z-30">

<script>
// ============================================
// KONFIGURASI — Ganti URL di bawah ini
// ============================================
const API_URL = 'https://script.google.com/macros/s/AKfycbzrISCHX8Biandy4Bzccj2PeF5fDO4BRL2gs-XcbCH_PwxH0V5aCvYlclpCjS33W17dhA/exec';

// ============================================
// STATE
// ============================================
let token = null, user = null;
let store = [];
let headers = [];
let sCol = null, sDir = 'asc';
let qSearch = '', fKondisi = '', fStatus = '', fGrade = '';
let loading = false;

// ============================================
// STATUS STYLES
// ============================================
const SS = {
    'SIAP PANEN':{bg:'rgba(16,185,129,.12)',tx:'#34D399',dt:'#10B981'},
    'PANEN':{bg:'rgba(16,185,129,.12)',tx:'#34D399',dt:'#10B981'},
    'PROSES':{bg:'rgba(59,130,246,.12)',tx:'#60A5FA',dt:'#3B82F6'},
    'DALAM PROSES':{bg:'rgba(59,130,246,.12)',tx:'#60A5FA',dt:'#3B82F6'},
    'BELUM':{bg:'rgba(245,158,11,.12)',tx:'#FBBF24',dt:'#F59E0B'},
    'BELUM SIAP':{bg:'rgba(245,158,11,.12)',tx:'#FBBF24',dt:'#F59E0B'},
    'SELESAI':{bg:'rgba(139,92,246,.12)',tx:'#A78BFA',dt:'#8B5CF6'},
    'TERTUNDA':{bg:'rgba(239,68,68,.12)',tx:'#F87171',dt:'#EF4444'},
    'CANCEL':{bg:'rgba(239,68,68,.12)',tx:'#F87171',dt:'#EF4444'},
    'DIBATALKAN':{bg:'rgba(239,68,68,.12)',tx:'#F87171',dt:'#EF4444'},
};
const DS = {bg:'rgba(107,114,128,.12)',tx:'#9CA3AF',dt:'#6B7280'};

// Grade styles
const GS = {
    'A':{bg:'rgba(16,185,129,.12)',tx:'#34D399'},'B':{bg:'rgba(59,130,246,.12)',tx:'#60A5FA'},
    'C':{bg:'rgba(245,158,11,.12)',tx:'#FBBF24'},'D':{bg:'rgba(239,68,68,.12)',tx:'#F87171'},
    'PREMIUM':{bg:'rgba(16,185,129,.12)',tx:'#34D399'},'STANDARD':{bg:'rgba(59,130,246,.12)',tx:'#60A5FA'},
    'EKONOMI':{bg:'rgba(245,158,11,.12)',tx:'#FBBF24'},'-':{bg:'rgba(107,114,128,.12)',tx:'#9CA3AF'},
};
const DG = {bg:'rgba(107,114,128,.12)',tx:'#9CA3AF'};

// Kondisi styles
const KS = {
    'SEEDLING':{bg:'rgba(16,185,129,.12)',tx:'#34D399'},
    'PEMBESARAN SEEDLING':{bg:'rgba(16,185,129,.12)',tx:'#34D399'},
    'REMAJA':{bg:'rgba(59,130,246,.12)',tx:'#60A5FA'},
    'DEWASA':{bg:'rgba(245,158,11,.12)',tx:'#FBBF24'},
};
const DK = {bg:'rgba(107,114,128,.12)',tx:'#9CA3AF'};

// ============================================
// MONTH HELPERS
// ============================================
const MNAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MSHORT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULAN_MAP = {};
['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember',
 'jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].forEach((b,i) => BULAN_MAP[b] = i % 12);

function parseEstBulan(val) {
    if (!val) return null;
    const s = String(val).trim();
    // "Desember 2025" format
    let m = s.toLowerCase().match(/^(\w+)\s+(\d{4})$/);
    if (m && BULAN_MAP[m[1]] !== undefined) return new Date(parseInt(m[2]), BULAN_MAP[m[1]], 1);
    // dd/mm/yyyy
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) return new Date(parseInt(m[3]), parseInt(m[2])-1, 1);
    // yyyy-mm-dd
    m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
    if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, 1);
    // Native fallback
    const d = new Date(s);
    if (!isNaN(d.getTime())) return new Date(d.getFullYear(), d.getMonth(), 1);
    return null;
}

// ============================================
// API
// ============================================
async function api(p) {
    const u = new URL(API_URL);
    Object.entries(p).forEach(([k,v]) => u.searchParams.set(k,v));
    const r = await fetch(u.toString());
    if (!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
}

// ============================================
// AUTH
// ============================================
async function doLogin() {
    const un = document.getElementById('i-user').value.trim();
    const pw = document.getElementById('i-pass').value;
    const errEl = document.getElementById('login-err');
    const errT = document.getElementById('login-err-t');
    const btn = document.getElementById('btn-login');

    if (!un||!pw){ errT.textContent='Username dan password wajib diisi'; errEl.classList.remove('hidden'); return; }
    errEl.classList.add('hidden');
    btn.disabled=true;
    document.getElementById('btn-login-t').textContent='Memproses...';
    document.getElementById('btn-login-l').classList.remove('hidden');

    try {
        const r = await api({action:'login',username:un,password:pw});
        if (r.success) {
            token=r.token; user={name:r.name,role:r.role,username:r.username};
            localStorage.setItem('pt_t',token);
            localStorage.setItem('pt_u',JSON.stringify(user));
            toast('Selamat datang, '+user.name,'success');
            goDash();
        } else { errT.textContent=r.error||'Login gagal'; errEl.classList.remove('hidden'); }
    } catch(e) { errT.textContent='Tidak dapat terhubung ke server'; errEl.classList.remove('hidden'); }
    finally { btn.disabled=false; document.getElementById('btn-login-t').textContent='Masuk'; document.getElementById('btn-login-l').classList.add('hidden'); }
}

function doLogout() {
    token=null; user=null;
    store=[];
    localStorage.removeItem('pt_t');
    localStorage.removeItem('pt_u');
    goLogin();
    toast('Berhasil keluar','info');
}

async function checkSess() {
    const t = localStorage.getItem('pt_t');
    const u = localStorage.getItem('pt_u');
    if (t && u) {
        try {
            const r = await api({action:'verify',token:t});
            if (r.valid){ token=t; user=JSON.parse(u); goDash(); return; }
        } catch(e) {}
    }
    localStorage.removeItem('pt_t');
    localStorage.removeItem('pt_u');
    goLogin();
}

// ============================================
// VIEW
// ============================================
function goLogin() {
    document.getElementById('v-login').classList.remove('hidden');
    document.getElementById('v-dash').classList.add('hidden');
    document.getElementById('i-user').value='';
    document.getElementById('i-pass').value='';
}

function goDash() {
    document.getElementById('v-login').classList.add('hidden');
    document.getElementById('v-dash').classList.remove('hidden');
    document.getElementById('u-name').textContent=user.name;
    const rb=document.getElementById('u-role');
    rb.textContent=user.role.toUpperCase();
    rb.className=user.role==='budidaya'
        ?'text-xs font-medium px-2 py-0.5 rounded-md bg-accent/15 text-accent border border-accent/20'
        :'text-xs font-medium px-2 py-0.5 rounded-md bg-blue-500/15 text-blue-400 border border-blue-500/20';
    loadData();
}

// ============================================
// DATA
// ============================================
async function loadData() {
    if (loading) return;
    loading=true; setLoad(true);
    try {
        const r=await api({action:'getData',sheet:'data_akan_panen',token});
        if (r.error) throw new Error(r.error);
        store=r.data||[]; headers=r.headers||[];
        fillFilters(); render(); stats();
        document.getElementById('t-time').textContent='Diperbarui: '+new Date().toLocaleTimeString('id-ID');
        setLoad(false);
    } catch(e) { setLoad(false); setErr(e.message); }
    finally { loading=false; }
}

function refreshData() {
    const ico=document.getElementById('ico-ref'); ico.classList.add('fa-spin');
    loadData().finally(()=>setTimeout(()=>ico.classList.remove('fa-spin'),500));
}

// ============================================
// FILTER & SORT
// ============================================
function filtered() {
    let d=store||[];
    if (qSearch){ const q=qSearch.toLowerCase(); d=d.filter(r=>Object.values(r).some(v=>String(v||'').toLowerCase().includes(q))); }
    if (fKondisi) d=d.filter(r=>String(r['KONDISI']||'').toUpperCase().trim()===fKondisi.toUpperCase());
    if (fStatus) d=d.filter(r=>String(r['STATUS']||'').toUpperCase().trim()===fStatus.toUpperCase());
    if (fGrade) d=d.filter(r=>String(r['GRADE']||'').toUpperCase().trim()===fGrade.toUpperCase());
    if (sCol) {
        d=[...d].sort((a,b)=>{
            let va=a[sCol],vb=b[sCol];
            const na=parseFloat(va),nb=parseFloat(vb);
            if (!isNaN(na)&&!isNaN(nb)) return sDir==='asc'?na-nb:nb-na;
            va=String(va||'').toLowerCase(); vb=String(vb||'').toLowerCase();
            return va<vb?(sDir==='asc'?-1:1):va>vb?(sDir==='asc'?1:-1):0;
        });
    }
    return d;
}

function fillFilters() {
    const ks=new Set(),ss=new Set(),gs=new Set();
    store.forEach(r=>{
        const k=String(r['KONDISI']||'').trim(),s=String(r['STATUS']||'').trim(),g=String(r['GRADE']||'').trim();
        if(k)ks.add(k); if(s)ss.add(s); if(g)gs.add(g);
    });
    const selK=document.getElementById('f-kondisi'),selS=document.getElementById('f-status'),selG=document.getElementById('f-grade');
    const pvK=fKondisi,pvS=fStatus,pvG=fGrade;
    
    selK.innerHTML='<option value="">Semua Kondisi</option>';
    [...ks].sort().forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;selK.appendChild(o);});
    selK.value=pvK;
    
    selS.innerHTML='<option value="">Semua Status</option>';
    [...ss].sort().forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;selS.appendChild(o);});
    selS.value=pvS;
    
    selG.innerHTML='<option value="">Semua Grade</option>';
    [...gs].sort().forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;selG.appendChild(o);});
    selG.value=pvG;
}

// ============================================
// RENDER
// ============================================
function render() {
    const data=filtered(), thead=document.getElementById('t-head'), tbody=document.getElementById('t-body'), cnt=document.getElementById('row-cnt');
    const total=store.length;
    if (!headers.length){thead.innerHTML='';tbody.innerHTML='';cnt.textContent='0 data';return;}
    let hh='<tr>';
    headers.forEach(c=>{
        const is=sCol===c;
        const arr=is?(sDir==='asc'?' <i class="fas fa-sort-up text-[10px]"></i>':' <i class="fas fa-sort-down text-[10px]"></i>'):' <i class="fas fa-sort text-[10px] opacity-25"></i>';
        hh+=`<th class="${is?'srt':''}" onclick="doSort('${c.replace(/'/g,"\\'")}')">${c}${arr}</th>`;
    });
    hh+='</tr>'; thead.innerHTML=hh;
    if (!data.length) {
        tbody.innerHTML=`<tr><td colspan="${headers.length}" class="text-center py-12 text-gray-600"><i class="fas fa-search mr-2 opacity-50"></i>Tidak ada data cocok dengan filter</td></tr>`;
    } else {
        let bh='';
        data.forEach(r=>{bh+='<tr>';headers.forEach(c=>{bh+='<td>'+cell(c,r[c])+'</td>';});bh+='</tr>';});
        tbody.innerHTML=bh;
    }
    cnt.textContent=data.length===total?total+' data':data.length+' dari '+total+' data';
}

function cell(col,val) {
    const v=String(val||'').trim();
    if (!v) return '<span class="text-gray-700">-</span>';
    const c=col.toUpperCase();
    if (c==='STATUS'){const s=SS[v.toUpperCase()]||DS;return `<span class="s-badge" style="background:${s.bg};color:${s.tx}"><span class="s-dot" style="background:${s.dt}"></span>${esc(v)}</span>`;}
    if (c==='GRADE'){const g=GS[v.toUpperCase()]||DG;return `<span class="g-badge" style="background:${g.bg};color:${g.tx}">${esc(v)}</span>`;}
    if (c==='KONDISI'){const k=KS[v.toUpperCase()]||DK;return `<span class="s-badge" style="background:${k.bg};color:${k.tx}">${esc(v)}</span>`;}
    if (c.includes('QTY')){const n=parseFloat(v.replace(/\./g,'').replace(',','.'));if(!isNaN(n))return `<span class="block text-right font-mono text-white">${n.toLocaleString('id-ID')}</span>`;}
    if (c==='KODE') return `<span class="font-mono text-accent/70 text-xs">${esc(v)}</span>`;
    if (c.includes('ESTIMASI')||c.includes('BULAN')) return `<span class="text-amber-300/70">${esc(v)}</span>`;
    return esc(v);
}

function stats() {
    const d=store;
    anim('s-total',d.length);
    const tq=d.reduce((s,r)=>{const n=parseFloat(String(r['QTY PANEN']||'').replace(/\./g,'').replace(',','.'));return s+(isNaN(n)?0:n);},0);
    anim('s-qty',tq);
    const td=d.reduce((s,r)=>{const n=parseFloat(String(r['TERDISTRIBUSI']||'').replace(/\./g,'').replace(',','.'));return s+(isNaN(n)?0:n);},0);
    anim('s-dist',td);
    let nearest=null;
    d.forEach(r=>{const p=parseEstBulan(r['ESTIMASI BULAN PANEN']);if(p&&(!nearest||p<nearest))nearest=p;});
    document.getElementById('s-near').textContent=nearest?MSHORT[nearest.getMonth()]+' '+nearest.getFullYear():'-';
}

function doSort(col) {
    if(sCol===col) sDir=sDir==='asc'?'desc':'asc'; else{sCol=col;sDir='asc';}
    render();
}

// ============================================
// STATES
// ============================================
function setLoad(on) {
    document.getElementById('v-load').classList.toggle('hidden',!on);
    document.getElementById('tbl-wrap').classList.toggle('hidden',on);
    document.getElementById('v-err').classList.add('hidden');
}
function setErr(msg) {
    document.getElementById('v-load').classList.add('hidden');
    document.getElementById('tbl-wrap').classList.add('hidden');
    document.getElementById('v-err').classList.remove('hidden');
    document.getElementById('err-msg').textContent=msg;
}

// ============================================
// EXPORT CSV
// ============================================
function exportCSV() {
    const d=filtered();
    if(!d.length){toast('Tidak ada data untuk di-export','warning');return;}
    let csv=headers.join(',')+'\n';
    d.forEach(r=>{csv+=headers.map(h=>{let v=String(r[h]||'');if(v.includes(',')||v.includes('"')||v.includes('\n'))v='"'+v.replace(/"/g,'""')+'"';return v;}).join(',')+'\n';});
    const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=`data_akan_panen_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
    toast(d.length+' data di-export','success');
}

// ============================================
// TOAST
// ============================================
function toast(msg,type='info') {
    const c={success:{bg:'rgba(16,185,129,.15)',bd:'rgba(16,185,129,.3)',tx:'#34D399',ic:'fa-check-circle'},error:{bg:'rgba(239,68,68,.15)',bd:'rgba(239,68,68,.3)',tx:'#F87171',ic:'fa-times-circle'},warning:{bg:'rgba(245,158,11,.15)',bd:'rgba(245,158,11,.3)',tx:'#FBBF24',ic:'fa-exclamation-circle'},info:{bg:'rgba(59,130,246,.15)',bd:'rgba(59,130,246,.3)',tx:'#60A5FA',ic:'fa-info-circle'}}[type]||{bg:'rgba(59,130,246,.15)',bd:'rgba(59,130,246,.3)',tx:'#60A5FA',ic:'fa-info-circle'};
    const el=document.createElement('div');
    el.className='toast flex items-center gap-2 px-4 py-3 rounded-lg text-sm backdrop-blur-md';
    el.style.cssText=`background:${c.bg};border:1px solid ${c.bd};color:${c.tx};min-width:240px`;
    el.innerHTML=`<i class="fas ${c.ic}"></i><span>${esc(msg)}</span>`;
    document.getElementById('toasts').appendChild(el);
    setTimeout(()=>{el.classList.add('out');el.addEventListener('animationend',()=>el.remove());},3000);
}

// ============================================
// UTILS
// ============================================
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function anim(id,target,dur=600) {
    const el=document.getElementById(id);if(!el)return;
    if(target===0){el.textContent='0';return;}
    const st=performance.now(),fl=!Number.isInteger(target);
    (function up(now){
        const p=Math.min((now-st)/dur,1),e=1-Math.pow(1-p,3);
        el.textContent=fl?(target*e).toFixed(1).replace(/\B(?=(\d{3})+(?!\d))/g,'.'):Math.floor(target*e).toLocaleString('id-ID');
        if(p<1)requestAnimationFrame(up);
    })(st);
}

// ============================================
// EVENTS
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    if (API_URL.includes('YOUR_DEPLOYMENT_ID')) document.getElementById('cfg-warn').style.display='';

    // Toggle password
    document.getElementById('btn-pw').addEventListener('click',()=>{
        const i=document.getElementById('i-pass'),ic=document.querySelector('#btn-pw i');
        if(i.type==='password'){i.type='text';ic.classList.replace('fa-eye','fa-eye-slash');}
        else{i.type='password';ic.classList.replace('fa-eye-slash','fa-eye');}
    });

    // Submit login
    document.getElementById('frm-login').addEventListener('submit',e=>{e.preventDefault();doLogin();});

    // Search debounced
    let st;
    document.getElementById('i-search').addEventListener('input',e=>{clearTimeout(st);st=setTimeout(()=>{qSearch=e.target.value;render();},180);});

    // Filters
    document.getElementById('f-kondisi').addEventListener('change',e=>{fKondisi=e.target.value;render();});
    document.getElementById('f-status').addEventListener('change',e=>{fStatus=e.target.value;render();});
    document.getElementById('f-grade').addEventListener('change',e=>{fGrade=e.target.value;render();});

    // Keyboard
    document.addEventListener('keydown',e=>{
        if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();const si=document.getElementById('i-search');if(si&&!document.getElementById('v-dash').classList.contains('hidden')){si.focus();si.select();}}
        if(e.key==='Escape'&&document.activeElement===document.getElementById('i-search')){document.getElementById('i-search').value='';qSearch='';render();document.getElementById('i-search').blur();}
        if(e.key==='Enter'&&!document.getElementById('v-login').classList.contains('hidden')){const a=document.activeElement;if(a.id==='i-user'||a.id==='i-pass')doLogin();}
    });

    // Init
    checkSess();
});
</script>
